{% extends 'main/base.html' %}

{% load static %}

{% block title %}Admin Chat Page{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 d-md-block sidebar">
            <div class="card mt-3">
                <div class="card-header text-center">
                    <h5>Actions</h5>
                </div>
                <div class="card-body">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a href="{% url 'admin_conversations' %}" class="nav-link btn btn-outline-primary w-100 mt-2">
                                Chats Page
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="{% url 'admin' %}" class="nav-link btn btn-outline-primary w-100 mt-2">
                                Admin Page
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="chat-container">
                <h2>Chat with {{ user.username }}</h2>

                <div id="chat-box" class="chat-box">
                    <!-- Messages will be dynamically loaded here -->
                </div>

                <form method="POST" class="chat-form">
                    {% csrf_token %}
                    <textarea id="message-input" name="message" placeholder="Enter your message here" class="chat-input"></textarea><br>
                    <button type="submit" class="chat-button">Reply</button>
                </form>
            </div>
        </main>
    </div>
</div>

<!-- AJAX for refreshing messages without reloading the page -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    function loadMessages() {
        $.ajax({
            url: "{% url 'get_messages' user.id %}",  // Pass the user_id to the URL
            method: 'GET',
            success: function(data) {
                let messages = JSON.parse(data.messages);
                let chatBox = document.getElementById("chat-box");
                chatBox.innerHTML = '';  // Clear the chat box
                
                messages.forEach(function(message) {
                    let msgDiv = document.createElement('div');
                    msgDiv.classList.add('chat-message');
                    
                    if (message.fields.sender == "{{ request.user.id }}") {
                        msgDiv.classList.add('user-message');
                        msgDiv.innerHTML = "<b>You (Admin):</b> " + message.fields.message;
                    } else {
                        msgDiv.classList.add('user-message-other');
                        msgDiv.innerHTML = "<b>{{ user.username }}:</b> " + message.fields.message;
                    }
                    chatBox.appendChild(msgDiv);
                });

                // Automatically scroll to the bottom of the chat box
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        });
    }

    // Load messages every 5 seconds
    setInterval(loadMessages, 5000);
    loadMessages();  // Initial load
</script>

<style>
    /* Sidebar styles */
    .sidebar {
        height: 100vh;
        padding-top: 20px;
        background-color: #f8f9fa;
    }

    .card {
        border-radius: 10px;
        border: 1px solid #ddd;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .card-header {
        background-color: #007bff;
        color: white;
        border-bottom: 1px solid #ddd;
    }

    .chat-container {
        max-width: 600px;
        margin: 20px auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 10px;
        background-color: #f9f9f9;
    }

    .chat-box {
        height: 300px;
        overflow-y: scroll;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 10px;
        background-color: #fff;
        margin-bottom: 15px;
    }

    .chat-message {
        margin-bottom: 10px;
        padding: 8px 12px;
        border-radius: 10px;
        max-width: 70%;
        word-wrap: break-word;
    }

    .user-message {
        background-color: #e0ffe0;
        text-align: right;
        margin-left: auto;
    }

    .user-message-other {
        background-color: #f1f1f1;
    }

    .chat-input {
        width: 100%;
        height: 50px;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 10px;
        resize: none;
    }

    .chat-button {
        background-color: #007bff;
        color: #fff;
        padding: 10px 20px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        margin-top: 10px;
    }

    .chat-button:hover {
        background-color: #0056b3;
    }

    /* Consistent button style for both sidebar buttons */
    .nav-link.btn-outline-primary {
        border-color: #007bff;
        color: #007bff;
        font-weight: 500;
        text-align: center;
    }

    .nav-link.btn-outline-primary:hover {
        background-color: #007bff;
        color: white;
    }
</style>
{% endblock %}
